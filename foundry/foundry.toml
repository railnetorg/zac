[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.34"
# fork tests live under test/zac/ (ZAC policy fork tests via ZacForkTest) and
# test/fork/ (contract fork tests against real Aave/Morpho/Safe). Both require
# RPC_URL — excluded from the default profile so `forge test` (no profile) skips them.
no_match_path = "test/{zac,fork}/**"

[profile.contracts-fork]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.34"
test = "test/fork"
# Override the inherited no_match_path from default so contract fork tests run here.
no_match_path = "__never_match__"

[profile.fork]
src = "src"
out = "out"
libs = ["lib"]
test = "../templates"
ffi = true
# Override the inherited no_match_path from default so zac fork tests run here.
no_match_path = "__never_match__"
# Allow template tests to import ZacForkTest via remapping.
remappings = ["zac-test/=test/zac/"]
fs_permissions = [
  { access = "read-write", path = "../examples" },
  { access = "read", path = "../action" },
  { access = "read", path = "../templates" },
  { access = "read", path = "../aliases" },
  { access = "read-write", path = "/tmp" },
  { access = "read-write", path = "cache" },
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
