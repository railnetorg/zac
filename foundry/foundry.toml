[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.34"
# fork tests live under test/fork/ — both the contract fork tests (real Aave/Morpho/Safe)
# and the ZAC policy template tests under test/fork/templates/ (which share the ZacForkTest
# harness in test/zac/). They require MAINNET_RPC_URL — excluded from the default profile so
# `forge test` (no profile) skips them; run them via `FOUNDRY_PROFILE=contracts-fork`.
no_match_path = "test/{zac,fork}/**"

[profile.contracts-fork]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.34"
test = "test/fork"
# Override the inherited no_match_path from default so contract fork tests run here.
no_match_path = "__never_match__"
# `test/fork/templates/` holds ZAC policy fork tests that drive the ZAC CLI over FFI
# (render + plan a `.zac.yaml`, apply the role-state-update calls). They import the
# shared `ZacForkTest` harness via the `zac-test/` remapping (in remappings.txt so the
# default profile can compile them too), read their `.zac.yaml` fixtures from
# `test/fork/templates/test_config/`, and resolve `template:` paths into the repo
# `templates/` dir.
ffi = true
fs_permissions = [
  { access = "read-write", path = "../examples" },
  # DeployLagoonVault writes its deployment artifact here. Scoped to this Foundry root so
  # the entry holds wherever the repository is vendored as a submodule.
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "../action" },
  { access = "read", path = "../templates" },
  { access = "read", path = "../aliases" },
  { access = "read", path = "test/fork/templates/test_config" },
  { access = "read-write", path = "/tmp" },
  { access = "read-write", path = "cache" },
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
