# Policy fixture for SpikoRedemptionRequestRoleMainnetTest. A full deployment
# config; the ZacForkTest harness substitutes the runtime placeholders before
# applying:
#   __MODIFIER__  → the freshly deployed Roles Modifier
#   __SAFE__      → the freshly deployed Safe
#   __MEMBER__    → the role member the test authorises
#   __TEMPLATES__ → the absolute templates/ directory
roles_modifier_address: "__MODIFIER__"
safe_address: "__SAFE__"
chain_id: 1
name: ZAC spiko redemption request fork test
description: In-process policy fork test for spiko.tmpl (SAFO redeemed into USDC through a Redemption request).
configs:
  - template: "__TEMPLATES__/spiko/spiko.tmpl"
    key: SPIKO
    members:
      - "__MEMBER__"
    params:
      payment_asset: "USDC"
      # Stand-in for the deposit address Spiko assigns.
      subscription_addresses:
        - "0x2222222222222222222222222222222222222222"
      fund: "SAFO"
      redeem_via: "redemption_request"
