# Policy fixture for MilkmanUniV3RoleMainnetTest. A full deployment config; the
# ZacForkTest harness substitutes the runtime placeholders before applying:
#   __MODIFIER__  → the freshly deployed Roles Modifier
#   __SAFE__      → the freshly deployed Safe
#   __MEMBER__    → the role member the test authorises
#   __TEMPLATES__ → the absolute templates/ directory
roles_modifier_address: "__MODIFIER__"
safe_address: "__SAFE__"
chain_id: 1
name: ZAC milkman UniV3 policy fork test
description: In-process policy fork test for milkman_univ3.tmpl.
configs:
  - template: "__TEMPLATES__/milkman/milkman_univ3.tmpl"
    key: STRATEGY_MANAGER
    members:
      - "__MEMBER__"
    params:
      swaps:
        # fees are in BIPS (the calculator multiplies by 100 into Uniswap's
        # hundredths-of-a-bip): 30 = the 0.3% PENDLE/WETH pool, 1 = the 0.01%
        # wstETH/WETH pool, 5 = the 0.05% USDC/WETH pool. A wrong unit points
        # at a nonexistent pool and the quoter reverts.
        - path: ["PENDLE", "WETH", "wstETH"] # multi-hop pricing route
          fees: [30, 1]
          max_slippage_bps: 200
        - path: ["WETH", "USDC"] # single hop, distinct cap + from-token
          fees: [5]
          max_slippage_bps: 100
