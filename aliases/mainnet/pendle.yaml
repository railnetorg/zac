# Pendle V3 — router + curated PT markets for the Markov PT-only vault.
#
# `router` is the canonical-per-chain Pendle V3 Router (IPAllActionV3); the
# pendle.tmpl policy pins it as the call target and as the approve spender.
#
# Each `markets` entry pins the addresses the policy scopes a PT trade against:
#   market     — the Pendle market (LP) contract for this PT / maturity
#   pt         — the Principal Token the Safe holds
#   yt         — the Yield Token; `redeemPyToToken` keys off the YT address
#   sy         — the Standardized Yield wrapper for this market
#   underlying — the SY redeem/mint token the policy pins as
#                TokenInput.tokenIn / TokenOutput.tokenOut, so Pendle's internal
#                aggregator is bypassed and USDC <-> underlying goes through the
#                milkman (CoW) template instead
#   maturity   — PT expiry (informational; redeemPyToToken is 1:1 after this)
#
# Demo set: two blue-chip stablecoin PTs at staggered maturities.
# Addresses sourced from the Pendle API (api-v2.pendle.finance) on 2026-06-09.
router: "0x888888888889758F76e7103c6CbF23ABbF58F946"

markets:
  susde_2026_08_13:
    market: "0x177768caf9D0e036725A51D3f60d7E20F2D4D194"
    pt: "0x5A19fa369F2895dCD8d2cEE62E4Ceae58eF92BBb"
    yt: "0x45A699A11A4a17fe0931EF3ceA4BFc3235e659F2"
    sy: "0xBF98480425A29197e5d99D003017f63a1e595D02"
    underlying: "0x9D39A5DE30e57443BfF2A8307A4256c8797A3497"  # sUSDe (Ethena)
    maturity: "2026-08-13"

  susds_2026_11_26:
