  # The first WETH-loan market in this registry: wstETH collateral against a
  # WETH debt, i.e. the borrow leg of a wstETH/WETH loop, where every other
  # entry above lends USDC. Note the LLTV — 96.5% against the 86% the wstETH
  # USDC market carries — so `borrow: true` on this market authorises roughly
  # 28x leverage where the Aave leg's 81% liquidation threshold caps it near
  # 4.65x. The protocol's own limit is not a meaningful backstop here; the
  # target LTV is operational discipline, which Roles cannot express.
  #
  # keccak256(abi.encode(loan, collateral, oracle, irm, lltv)) must equal the
  # market id 0xb8fc70e82bc5bb53e773626fcc6a23f7eefa036918d7ef216ecfb1950a94a85e
  # — all five fields below were read back from Morpho's idToMarketParams for
  # that id, so a typo here scopes a different market rather than failing.
  weth_wsteth_965:
    loan_token: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"  # WETH
    collateral_token: "0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0"  # wstETH
    oracle: "0xbD60A6770b27E084E8617335ddE769241B0e71D8"
    irm: "0x870aC11D48B15DB9a138Cf899d20F13F79Ba00BC"
    lltv: "965000000000000000"
