# Circle CCTP v2 — Cross-Chain Transfer Protocol contracts on Base mainnet
# (CCTP domain 6).
#
# For the Ethereum → Base PoC, Base is the DESTINATION chain: USDC is minted here
# by a keeper/relayer calling message_transmitter_v2.receiveMessage with Circle's
# attestation, and the destination Safe receives it passively. None of these are
# scoped by a Roles policy on the destination side.
#
# Provided for destination-side reference and for future Base-as-home bridging,
# where token_messenger_v2 + usdc would be pinned exactly as on mainnet.
#
# v2 addresses are identical across EVM chains. Verified against Circle docs
# (developers.circle.com/cctp/evm-smart-contracts) on 2026-06-23.
