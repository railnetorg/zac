name: contracts-fork-test

on: [push]

jobs:
  contracts-fork-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: oven-sh/setup-bun@v2

      - uses: extractions/setup-just@v4

      # The ZAC policy tests drive the CLI over FFI (`bun ../action/cli.ts`), so the
      # action's dependencies have to be installed before the suite can run.
      - run: just install

      # The suite forks at chain head, so a run reflects mainnet as it is now.
      # It is the only gate-level coverage of the Roles policies, so a missing
      # endpoint fails the job rather than skipping the tests.
      - name: just forge-test-fork
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          if [ -z "$MAINNET_RPC_URL" ]; then
            echo "::error::MAINNET_RPC_URL secret is not set"
            exit 1
          fi
          just forge-test-fork "$MAINNET_RPC_URL"
