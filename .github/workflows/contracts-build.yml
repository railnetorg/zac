name: contracts-build

on: [push, pull_request]

jobs:
  contracts-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - run: forge build --sizes
        env:
          FOUNDRY_PROFILE: ci
