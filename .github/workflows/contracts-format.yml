name: contracts-format

on: [push]

jobs:
  contracts-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: extractions/setup-just@v4

      - run: just contracts-format-check
