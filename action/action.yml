name: zac
description: Generate Zodiac Roles V2 configs from `*.zac.yaml` sources
inputs:
  config-path:
    description: Path to a `.zac.yaml` source file or a directory of sources (walked recursively). Generated `.yaml` files are written alongside each source.
    required: true
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
    - shell: bash
      env:
        ZAC_CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        cd "${{ github.action_path }}/.."
        bun install --cwd action
        bun ./action/cli.ts generate "$ZAC_CONFIG_PATH"
