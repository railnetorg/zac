# Per-safe-dir Safe-level configuration.
#
# Sits at the root of `<network>/<safe-address>/`. Declares the desired
# guard contract, fallback handler, and enabled modules — diffed by
# `plan --revoke-unmentioned=true` against live Safe state.
#
# Three keys, all required:
#   guard:    <address> | <guard-object> | ~  (~ = don't manage;
#                                              0x000…0 = EXPLICITLY clear
#                                              the on-chain guard via
#                                              setGuard(0x0) — use ~ to
#                                              leave the slot untouched)
#   fallback: <address> | ~                   (~ = don't manage; 0x000…0 =
#                                              EXPLICITLY clear the on-chain
#                                              fallback handler via
#                                              setFallbackHandler(0x0) —
#                                              use ~ to leave untouched)
#   modules:  [<addr>, ...] | ~               (~ = don't manage; list = full reconcile)
#
# `guard` accepts either a bare address or a nested object with a timelock
# configuration. The nested form is required when the guard is a
# TimelockGuard (or compatible): plan batches `setGuard` together with
# `configureTimelockGuard(delay)` in one Safe transaction so the guard is
# never enabled with a zero delay window.
#
#   guard:
#     address: 0xTimelockGuardOnly...
#     timelock_delay: 86400   # seconds — positive integer required
#
# All-`~` (this file) is the documented opt-out: every plan run touches
# zero Safe-level state regardless of what's on-chain. Promote a `~` to a
# concrete address (or `{{ aliases.* }}`) to start managing that field.
#
# When `modules` is a list, the Roles modifier MUST be explicitly included
# — cross-validated against every sibling *.zac.yaml file's
# `roles_modifier_address`. No auto-preservation.
#
# `aliases.ZERO` is auto-injected as 0x0000…0000 — usable as a literal
# value or a sentinel.
guard: ~
fallback: ~
modules: ~
