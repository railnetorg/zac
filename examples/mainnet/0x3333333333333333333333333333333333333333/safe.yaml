# Per-safe-dir Safe-level configuration.
#
# Sits at the root of `<network>/<safe-address>/`. Declares the desired
# guard contract, fallback handler, and enabled modules — diffed by
# `plan --revoke-unmentioned=true` against live Safe state.
#
# Three keys, all required:
#   guard:    <address> | ~     (~ = don't manage; 0x000…0 = EXPLICITLY
#                                 clear the on-chain guard via
#                                 setGuard(0x0) — use ~ to leave the slot
#                                 untouched)
#   fallback: <address> | ~     (~ = don't manage; 0x000…0 = EXPLICITLY
#                                 clear the on-chain fallback handler via
#                                 setFallbackHandler(0x0) — use ~ to leave
#                                 the slot untouched)
#   modules:  [<addr>, ...] | ~ (~ = don't manage; list = full reconcile)
#
# One OPTIONAL key:
#   nested_signers: [<addr>, ...] | ~  (parent-Safe owners that are
#                                 THEMSELVES Safes — "nested signers".
#                                 NEVER produces a plan call; surfaces a
#                                 per-child EIP-1271 signing-hash preview
#                                 at `plan` time and emits an
#                                 authoritative `nested-signer ...` line at
#                                 `submit`/`apply`. Omit the key entirely or
#                                 use `~` to opt out.)
#
# All-`~` (this file) is the documented opt-out: every plan run touches
# zero Safe-level state regardless of what's on-chain. Promote a `~` to a
# concrete address, or to an `aliases` template expression, to start
# managing that field.
#
# When `modules` is a list, the Roles modifier MUST be explicitly included
# — cross-validated against every sibling *.zac.yaml file's
# `roles_modifier_address`. No auto-preservation.
#
# `aliases.ZERO` is auto-injected as 0x0000…0000 — usable as a literal
# value or a sentinel.
guard: ~
fallback: ~
modules: ~
# nested_signers is OPTIONAL — omit it (as below, via this comment) or set
# `~` to opt out. Example with a literal address and an alias:
{% raw %}#   nested_signers:
#     - "0x1111111111111111111111111111111111111111"
#     - "{{ aliases.signers.treasury_safe }}"{% endraw %}
nested_signers: ~
