roles_modifier_address: "{{ aliases.modifiers.my_modifier }}"
safe_address: "{{ aliases.safes.my_safe }}"
chain_id: 1
name: My Safe Milkman UniV3 Swap Manager
description: Price-protected PENDLE → wstETH swaps via CowSwap Milkman, quoted against a pinned Uniswap V3 route.
configs:
  - template: "../../../templates/milkman/milkman_univ3.tmpl"
    key: STRATEGY_MANAGER
    members:
      - "{{ aliases.signers.alice }}"
    params:
      # The UniV3 variant of the Milkman template: for tokens with no usable
      # Chainlink feed on mainnet (PENDLE has none from any provider), the
      # slippage cap is measured against a pinned Uniswap V3 pool route instead
      # of a feed path. The route is a PRICING reference only — the swap still
      # settles wherever the CoW solver finds best execution, and intermediate
      # path tokens never touch the Safe.
      #
      # The quote is the route's CURRENT state (spot, not TWAP), so the caps
      # and clip sizes carry the security argument: loss per order is bounded
      # by max_slippage_bps × order size, and moving the pinned pools past the
      # cap costs the manipulator real slippage + LP fees against the pools'
      # depth. Keep max_approval small relative to that depth; prefer
      # milkman.tmpl whenever a Chainlink feed exists.
      swaps:
        # fees are in BIPS, not Uniswap fee units (the calculator multiplies by
        # 100): 30 = the 0.3% PENDLE/WETH pool, 1 = the 0.01% wstETH/WETH pool.
        # A wrong unit points at a nonexistent pool and orders never settle.
        - path: [PENDLE, WETH, wstETH]
          fees: [30, 1]
          max_slippage_bps: 200 # ≤ 2%
      # Exclusive ceiling on each approve to Milkman — the per-clip bound the
      # spot-quote analysis above relies on (~5,000 PENDLE here).
      max_approval: "5000000000000000000000"
