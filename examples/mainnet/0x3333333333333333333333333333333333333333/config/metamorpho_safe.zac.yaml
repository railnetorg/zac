roles_modifier_address: "{{ aliases.modifiers.my_modifier }}"
safe_address: "{{ aliases.safes.my_safe }}"
chain_id: 1
name: My Safe MetaMorpho LP
description: Deposit and withdraw on MetaMorpho vaults; receiver/owner pinned to avatar
configs:
  - template: "../../../../templates/metamorpho/metamorpho.tmpl"
    key: METAMORPHO_LP
    members:
      - "{{ aliases.signers.alice }}"
      - "{{ aliases.signers.bob }}"
    params:
      vaults:
        - address: "{{ aliases.metamorpho.steakhouse_usdc.address }}"
          underlying: "{{ aliases.metamorpho.steakhouse_usdc.underlying }}"
          name: "{{ aliases.metamorpho.steakhouse_usdc.name }}"
          symbol: "{{ aliases.metamorpho.steakhouse_usdc.symbol }}"
