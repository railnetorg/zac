roles_modifier_address: "{{ aliases.modifiers.my_modifier }}"
safe_address: "{{ aliases.safes.my_safe }}"
chain_id: 1
name: My Safe Morpho Blue Manager
description: Supply and withdraw USDC across selected Morpho Blue markets
configs:
  - template: "../../../templates/morpho_blue/morpho_blue.tmpl"
    key: MORPHO_BLUE
    members:
      - "{{ aliases.signers.alice }}"
    params:
      morpho_address: "{{ aliases.morpho_blue.singleton }}"
      deposit_assets:
        - address: "{{ aliases.tokens.USDC }}"
          symbol: "USDC"
      markets:
        - loan_token: "{{ aliases.morpho_blue.markets.usdc_cbbtc_86.loan_token }}"
          collateral_token: "{{ aliases.morpho_blue.markets.usdc_cbbtc_86.collateral_token }}"
          oracle: "{{ aliases.morpho_blue.markets.usdc_cbbtc_86.oracle }}"
          irm: "{{ aliases.morpho_blue.markets.usdc_cbbtc_86.irm }}"
          lltv: "{{ aliases.morpho_blue.markets.usdc_cbbtc_86.lltv }}"
        - loan_token: "{{ aliases.morpho_blue.markets.usdc_wbtc_86.loan_token }}"
          collateral_token: "{{ aliases.morpho_blue.markets.usdc_wbtc_86.collateral_token }}"
          oracle: "{{ aliases.morpho_blue.markets.usdc_wbtc_86.oracle }}"
          irm: "{{ aliases.morpho_blue.markets.usdc_wbtc_86.irm }}"
          lltv: "{{ aliases.morpho_blue.markets.usdc_wbtc_86.lltv }}"
