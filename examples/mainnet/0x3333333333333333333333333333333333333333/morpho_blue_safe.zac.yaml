roles_modifier_address: "{{ aliases.modifiers.my_modifier }}"
safe_address: "{{ aliases.safes.my_safe }}"
chain_id: 1
name: My Safe Morpho Blue Manager
description: Supply and withdraw across curated Morpho Blue markets
configs:
  - template: "../../../templates/morpho_blue/morpho_blue.tmpl"
    key: MORPHO_BLUE
    members:
      - "{{ aliases.signers.alice }}"
      - "{{ aliases.signers.bob }}"
    params:
      # Lending only: supply / withdraw of the loan token. Flip to `true` to also
      # scope supplyCollateral / withdrawCollateral / borrow / repay and the
      # collateral-token approves — that grants the authority to create debt, so it
      # is a decision rather than a default.
      borrow: false
      markets:
        - "usdc_cbbtc_86"
        - "usdc_wbtc_86"
        - "usdc_mfone_915"
        - "usdc_wsteth_86"
        - "usdc_syrupusdc_915"
