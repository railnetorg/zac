roles_modifier_address: "{{ aliases.modifiers.my_modifier }}"
safe_address: "{{ aliases.safes.my_safe }}"
chain_id: 1
name: My Safe AAVE V3 Manager
description: Supply, withdraw, borrow and repay on Aave V3
configs:
  - template: "../../../templates/aave_v3/aave_v3.tmpl"
    key: AAVE_V3
    members:
      - "{{ aliases.signers.alice }}"
      - "{{ aliases.signers.bob }}"
    params:
      deposit_assets:
        - "USDC"
        - "USDT"
        - "DAI"
        - "WETH"
        - "wstETH"
        - "cbETH"
        - "WBTC"
        - "LINK"
      # Borrow side on: borrow / repay / setUserEMode. `false` keeps the role to
      # supply / withdraw only. This grants the authority to create debt, so it
      # is a decision rather than a default.
      borrow: true
      emode_category: 0
