roles_modifier_address: "{{ aliases.modifiers.my_modifier }}"
safe_address: "{{ aliases.safes.my_safe }}"
chain_id: 11155111
name: Sepolia Test Safe Morpho Blue Manager
description: Supply and withdraw USDC on Morpho Blue Sepolia, single-member test config
configs:
  - template: "../../../templates/morpho_blue/morpho_blue.tmpl"
    key: MORPHO_BLUE
    members:
      - "{{ aliases.signers.sepolia_member }}"
    params:
      morpho_address: "{{ aliases.morpho_blue.singleton }}"
      deposit_assets:
        - address: "{{ aliases.tokens.USDC }}"
          symbol: "USDC"
      markets:
        - loan_token: "{{ aliases.morpho_blue.markets.usdc_weth_915.loan_token }}"
          collateral_token: "{{ aliases.morpho_blue.markets.usdc_weth_915.collateral_token }}"
          oracle: "{{ aliases.morpho_blue.markets.usdc_weth_915.oracle }}"
          irm: "{{ aliases.morpho_blue.markets.usdc_weth_915.irm }}"
          lltv: "{{ aliases.morpho_blue.markets.usdc_weth_915.lltv }}"
